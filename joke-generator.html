<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .joke-box {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 30px;
            margin: 30px 0;
            border-radius: 10px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joke-text {
            font-size: 1.2em;
            color: #555;
            line-height: 1.6;
            font-weight: 500;
        }

        .joke-setup {
            margin-bottom: 15px;
            font-weight: 600;
            color: #333;
        }

        .joke-punchline {
            margin-top: 15px;
            color: #667eea;
            font-weight: bold;
        }

        .loading {
            display: none;
            font-size: 1.2em;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
            transform: translateY(-3px);
        }

        .joke-category {
            margin-top: 20px;
            font-size: 0.9em;
            color: #999;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .error {
            color: #e74c3c;
            padding: 20px;
            background: #fadbd8;
            border-radius: 10px;
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2em;
                margin-bottom: 30px;
            }

            .joke-box {
                padding: 20px;
                min-height: 80px;
            }

            .joke-text {
                font-size: 1em;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        
        <div class="joke-box">
            <div id="jokeContent" class="joke-text">
                Click the button to get a random joke!
            </div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                Loading joke...
            </div>
        </div>

        <div id="errorMessage" class="error"></div>

        <div class="button-group">
            <button class="btn-primary" onclick="getJoke()">Get Joke</button>
            <button class="btn-secondary" onclick="copyJoke()">Copy Joke</button>
        </div>

        <div class="joke-category">
            <p>Powered by JokeAPI</p>
        </div>
    </div>

    <script>
        let currentJoke = '';

        async function getJoke() {
            const jokeContent = document.getElementById('jokeContent');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');

            // Show loading state
            loading.style.display = 'block';
            jokeContent.style.display = 'none';
            errorMessage.style.display = 'none';

            try {
                // Fetch joke from JokeAPI
                const response = await fetch('https://v2.jokeapi.dev/joke/Any?format=json');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                // Handle joke format (single or two-part)
                if (data.type === 'single') {
                    currentJoke = data.joke;
                    jokeContent.innerHTML = `<div class="joke-text">${escapeHtml(data.joke)}</div>`;
                } else if (data.type === 'twopart') {
                    currentJoke = `${data.setup}\n\n${data.delivery}`;
                    jokeContent.innerHTML = `
                        <div class="joke-text">
                            <div class="joke-setup">${escapeHtml(data.setup)}</div>
                            <div class="joke-punchline">${escapeHtml(data.delivery)}</div>
                        </div>
                    `;
                }

                loading.style.display = 'none';
                jokeContent.style.display = 'block';

            } catch (error) {
                loading.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.textContent = `Error: ${error.message}. Please try again.`;
                console.error('Error fetching joke:', error);
            }
        }

        function copyJoke() {
            if (!currentJoke) {
                alert('Please get a joke first!');
                return;
            }

            navigator.clipboard.writeText(currentJoke)
                .then(() => {
                    alert('Joke copied to clipboard!');
                })
                .catch(() => {
                    // Fallback for browsers that don't support clipboard API
                    const textArea = document.createElement('textarea');
                    textArea.value = currentJoke;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    alert('Joke copied to clipboard!');
                });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Load a joke when page loads
        window.addEventListener('load', getJoke);
    </script>
</body>
</html>
